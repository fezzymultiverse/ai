name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['V*', 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Bridge, voice and credential regression tests
        run: npm test

      - name: Browser navigation and privacy regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Apply app identity from repo variables
        env:
          APP_ID: ${{ vars.ROBBERY_APP_ID }}
          APP_NAME: ${{ vars.ROBBERY_APP_NAME }}
        run: |
          APP_ID="${APP_ID:-com.festers.horizon}"
          APP_NAME="${APP_NAME:-Horizon}"
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.appId = process.env.APP_ID;
            c.appName = process.env.APP_NAME;
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          "
          echo "appId=${APP_ID} appName=${APP_NAME}"

      - name: Add Android platform
        run: npx cap add android

      - name: Apply icons and splash
        run: bash scripts/apply-android.sh

      - name: Bundle the built-in voice (sherpa-onnx + Kitten)
        env:
          GH_TOKEN: ${{ github.token }}
          SHERPA_VERSION: ${{ vars.SHERPA_VERSION }}
        run: bash scripts/bundle-voice.sh

      - name: Set version
        run: bash scripts/set-version.sh "${{ github.run_number }}"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify native plugins are inside the APK
        run: |
          set -euo pipefail
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          echo "APK: $UNSIGNED"
          rm -rf "$RUNNER_TEMP/dexcheck" && mkdir -p "$RUNNER_TEMP/dexcheck"
          unzip -q -o "$UNSIGNED" 'classes*.dex' -d "$RUNNER_TEMP/dexcheck"
          echo "dex files:"; ls -l "$RUNNER_TEMP"/dexcheck/
          MISSING=""
          for cls in HorizonAIPlugin HorizonAIService HorizonMediaPlugin HorizonSpeechPlugin HorizonVoicePlugin HorizonDaemonPlugin OfflineTtsKittenModelConfig HorizonPermsPlugin HorizonNotify HorizonScopes HorizonLockPlugin HorizonBrowserPlugin HorizonWhatsAppPlugin HorizonWhatsAppListener HorizonTermuxPlugin HorizonTermuxResultReceiver HorizonExtractorPlugin; do
            if grep -aq "$cls" "$RUNNER_TEMP"/dexcheck/classes*.dex; then
              echo "  ok       $cls"
            else
              echo "  MISSING  $cls"; MISSING="$MISSING $cls"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing from the APK:$MISSING"
            echo "Native sources that were applied:"; ls -l "android/app/src/main/java/"*/*/*/ 2>/dev/null || true
            exit 1
          fi
          echo "All native plugins present in the APK."
          echo "Built-in voice payload:"
          LIST="$(unzip -l "$UNSIGNED")"
          for f in lib/arm64-v8a/libsherpa-onnx-jni.so lib/arm64-v8a/libonnxruntime.so assets/horizon_voice/tokens.txt assets/horizon_voice/voices.bin assets/horizon_voice/VERSION; do
            if grep -qF "$f" <<<"$LIST"; then echo "  ok       $f"; else echo "::error::Missing from the APK: $f"; exit 1; fi
          done
          grep -qE 'assets/horizon_voice/model[a-z0-9._]*\.onnx' <<<"$LIST" || { echo "::error::Voice model is not in the APK"; exit 1; }
          echo "  ok       Voice model"

      - name: Sign APK with release keystore
        env:
          KS_B64: ${{ secrets.JUICE999_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.LUCID_DREAMS_ALIAS }}
          KS_PASS: ${{ secrets.LUCID_DREAMS_PASS }}
        run: |
          set -euo pipefail
          for v in KS_B64 KS_ALIAS KS_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is missing or empty. Refusing to ship a debug-signed APK."; exit 1; fi
          done

          echo "[1/6] Decode keystore"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

          echo "[2/6] Keystore contents (alias + fingerprint)"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env KS_PASS 2>&1 | grep -Ev "^(Warning|Keystore provider)" || true

          echo "[3/6] Locate tools and unsigned APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          echo "build-tools: $BT"
          echo "unsigned:    $UNSIGNED"

          echo "[4/6] zipalign"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          echo "[5/6] apksigner sign"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"

          echo "[6/6] apksigner verify"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" 2>&1 | tee "$RUNNER_TEMP/verify.txt"
          grep -i "SHA-256" "$RUNNER_TEMP/verify.txt" || true

          rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK
        id: apk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="Horizon-V${VERSION//./_}-b${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist
          cp "$RUNNER_TEMP/signed.apk" "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "---- AndroidManifest.xml ----"
          cat android/app/src/main/AndroidManifest.xml 2>/dev/null || echo "(no manifest)"
          echo "---- app/build.gradle ----"
          cat android/app/build.gradle 2>/dev/null || echo "(no app/build.gradle)"
          echo "---- native sources ----"
          ls -l android/app/src/main/java/*/*/*/ 2>/dev/null || echo "(no sources)"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.apk.outputs.name }}
          generate_release_notes: true
